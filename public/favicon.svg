<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="100%" height="100%">
  <defs>
    <!-- Deep Executive Gradients -->
    <linearGradient id="silentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
  </defs>

  <!-- Left: Minimalist Icon (Apex / Open Pages) -->
  <g transform="translate(50, 45)">
    <!-- Left Pillar -->
    <path d="M 20,120 L 70,30 L 70,120 Z" fill="url(#silentBlue)" opacity="0.9" />
    
    <!-- Right Pillar -->
    <path d="M 75,30 L 125,120 L 75,120 Z" fill="url(#silentBlue)" opacity="0.75" />
    
    <!-- Gold Apex Spark -->
    <polygon points="72.5,15 82.5,30 62.5,30" fill="url(#goldAccent)" />
    
    <!-- Base Line -->
    <rect x="15" y="130" width="115" height="4" rx="2" fill="url(#goldAccent)" />
  </g>

  <!-- Right: Brand Typography -->
  <!-- Main Name: ITA -->
  <text x="210" y="132" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="86" font-weight="800" fill="#0F172A" letter-spacing="6">
    ITA
  </text>
  
  <!-- Accent Dot -->
  <circle cx="400" cy="122" r="7" fill="url(#goldAccent)" />

  <!-- Full Form Subtitle: INTERNATIONAL TROVA ACADEMY -->
  <text x="215" y="165" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#64748B" letter-spacing="3.5">
    INTERNATIONAL TROVA ACADEMY
  </text>
  
  <!-- Subtle Accent Underline -->
  <line x1="215" y1="178" x2="615" y2="178" stroke="url(#goldAccent)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
